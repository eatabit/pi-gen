# /etc/NetworkManager/conf.d/eatabit-wifi-powersave.conf
# BUG-093 -- Wi-Fi power-save OFF on every Wi-Fi connection that does not set its own.
# 2 = disable (NM_SETTING_WIRELESS_POWERSAVE_DISABLE). 0 would mean "use default",
# which is how every gateway came to run with the driver default (on).
[connection]
wifi.powersave = 2
